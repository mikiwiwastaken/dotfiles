general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.4
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244)
    font_size = 90
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

# Date (refreshed every 60 s)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d/%m/%Y"
    color = rgba(205, 214, 244, 0.8)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 14
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(180, 190, 254, 0.6)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgb(205, 214, 244)
    check_color = rgb(249, 226, 175)
    fail_color = rgb(243, 139, 168)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password...</span>
    fail_text = <i>$FAIL</i>
    position = 0, -40
    halign = center
    valign = center
}

$music = $HOME/.local/bin/music

# Album art (the script prints a local file path)
image {
    monitor =
    path =
    reload_time = 0
    reload_cmd = $music --arturl
    size = 110
    rounding = 18
    border_size = 2
    border_color = rgba(180, 190, 254, 0.5)
    position = -155, -190
    halign = center
    valign = center
    zindex = 5
}

# Title
label {
    monitor =
    text = cmd[update:1000] $music --title
    color = rgb(205, 214, 244)
    font_size = 14
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 63, -164
    halign = center
    valign = center
    zindex = 5
}

# Artist
label {
    monitor =
    text = cmd[update:1000] $music --artist
    color = rgb(166, 173, 200)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 63, -190
    halign = center
    valign = center
    zindex = 5
}

# Status icon + elapsed / total time
label {
    monitor =
    text = cmd[update:1000] echo "$($music --status)  $($music --time)"
    color = rgb(180, 190, 254)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 63, -216
    halign = center
    valign = center
    zindex = 5
}
